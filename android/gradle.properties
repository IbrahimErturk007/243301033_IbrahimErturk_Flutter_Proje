org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true -Djava.io.tmpdir=C:\\gradle-tmp
org.gradle.daemon=false
# Türkçe karakterli kullanıcı yolu nedeniyle Java Unix Domain Socket loopback hatası
# yaşamamak için tüm geçici dosyaları ASCII bir klasöre yönlendiriyoruz.
systemProp.java.io.tmpdir=C:\\gradle-tmp
android.useAndroidX=true
# Proje yolu Türkçe karakter içerdiği için Gradle uyarısını bastır
android.overridePathCheck=true
